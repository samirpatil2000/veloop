<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Veloop</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <strong>Veloop</strong>
        <span id="status">Ready</span>
      </header>

      <section class="hero">
        <div class="state" id="state">LIVE</div>
        <div class="hint" id="hint">Hold Right Alt to record</div>
      </section>

      <button id="record">Start recording</button>
      <button id="live" class="secondary">Go live</button>

      <!-- Save active loop section -->
      <section id="saveSection" class="save-section hidden">
        <div class="save-label">Save Current Loop</div>
        <div class="save-row">
          <input id="presetTitleInput" type="text" placeholder="Preset name (e.g. Nodding)" maxlength="32" />
          <button id="savePresetBtn">Save</button>
        </div>
      </section>

      <!-- Soundboard presets section -->
      <section class="presets-section">
        <div class="presets-header">
          <span>Presets Soundboard</span>
          <span id="presetsCount" class="count-badge">0</span>
        </div>
        <div id="presetsList" class="presets-list"></div>
        <div id="noPresetsMsg" class="empty-msg">No saved presets yet.<br>Record a loop with your pedal to save it here.</div>
      </section>

      <footer>
        <a href="#" id="settings">Settings</a>
        <span class="footer-sep">•</span>
        <a href="https://github.com/samirpatil2000/veloop" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="footer-sep">•</span>
        <a href="https://github.com/samirpatil2000" target="_blank" rel="noopener noreferrer" class="developer-credit">by Samir Patil</a>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
